<!-- Только разметка для меню уровней, вставляется в #level-select -->
<button class="back-button" onclick="openMainMenu()"><span>✕</span></button>
<img src="name.png" style="width: 60%; max-width: 250px; height: auto; margin-bottom: 20px; animation: floatTitle 3s ease-in-out infinite; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));" alt="BottleSort">
<div class="level-grid" id="level-grid"></div>

<style>
    /* Стили для меню уровней */
    .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; width: 80%; max-width: 300px; }
    .level-btn {
        position: relative; width: 60px; height: 60px; background: black; border-radius: 16px; padding: 2px;
        border: none; cursor: pointer; transition: 0.1s, box-shadow 0.2s;
        background-image: linear-gradient(to top, #8122b0, #dc98fd);
        display: flex; justify-content: center; align-items: center;
        box-shadow: 0 0 15px rgba(185, 49, 252, 0.3);
    }
    .level-btn:active { transform: scale(0.92); }
    .level-btn:hover { box-shadow: 0 0 25px rgba(185, 49, 252, 0.7); }
    .level-btn span {
        width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
        background: #B931FC; border-radius: 14px;
        background-image: linear-gradient(to top, #a62ce2, #c045fc);
        color: white; font-weight: bold; font-size: 1.2rem;
    }
    .level-btn.locked { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
    .level-btn.current { box-shadow: 0 0 30px rgba(0, 210, 255, 0.8); }
</style>
